name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: scripts
        if: runner.os == 'Linux'
        run: bash scripts/t2_test.sh

  lint:
    name: lint (scripts and boundary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck is preinstalled on ubuntu-latest runners.
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: boundary guard tests
        run: bash scripts/check_boundary_test.sh
      # This repository is public: no plans, prices, ADRs, customer data or secrets.
      - name: public/private boundary
        run: bash scripts/check_boundary.sh

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        # arm64 covers Apple silicon, Windows on ARM and Linux on AWS Graviton.
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = windows ]; then ext=".exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X github.com/sitewarm/sitewarm/pkg/sitewarm.Version=${GITHUB_SHA::7}" \
            -o "dist/sitewarm_${GOOS}_${GOARCH}${ext}" ./cmd/sitewarm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitewarm_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/
          retention-days: 14
